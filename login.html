<!doctype html>
<!--
  Login-Seite für buensapps.de/alissas-blog (kein normaler Blog-Inhalt).
  Der Server (Apache mod_auth_form) leitet alle Blog-Seiten hierher um, bis man eingeloggt ist.
  Nur der Code wird abgefragt; der Benutzername "alissa" steckt im versteckten Feld unten.
  Absichtlich komplett eigenständig (CSS/JS inline): vor dem Login sind style.css und die
  anderen Dateien noch gesperrt. Code ändern: ssh -t hostinger alissas-blog-password
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Alissas Blog</title>
    <script>
      // Gleiche Theme- & Jahreszeiten-Logik wie theme-toggle.js
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }

        var d = new Date();
        var m = d.getMonth() + 1;
        var day = d.getDate();
        var season = "standard";

        if (m === 12 && day >= 1 && day <= 25) {
          season = "christmas";
        } else if ((m === 12 && day >= 26) || m === 1 || m === 2 || (m === 3 && day < 20)) {
          season = "winter";
        } else if ((m === 9 && day >= 23) || m === 10 || m === 11) {
          season = "autumn";
        }

        if (season !== "standard") {
          document.documentElement.classList.add(season);
        }
      })();
    </script>
    <style>
      :root {
        --sky-top: #8fb895;
        --sky-bottom: #bfe0c4;
        --mtn-back: #284032;
        --mtn-mid: #3c5c45;
        --ground: #ffffff;
        --card: rgba(255, 255, 255, 0.92);
        --card-border: rgba(40, 64, 50, 0.12);
        --text: #1e293b;
        --muted: #64748b;
        --input-bg: #ffffff;
        --input-border: #cbd5e1;
        --accent: #3c5c45;
        --accent-hover: #284032;
        --accent-text: #ffffff;
        --focus: rgba(60, 92, 69, 0.35);
        --error: #b91c1c;
        --error-bg: #fef2f2;
        --info: #3c5c45;
        --info-bg: #ecf5ee;
        --font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      html.dark {
        --sky-top: #030712;
        --sky-bottom: #172e54;
        --mtn-back: #24385a;
        --mtn-mid: #19273f;
        --ground: #0f172a;
        --card: rgba(15, 23, 42, 0.88);
        --card-border: rgba(148, 163, 184, 0.18);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --input-bg: #1e293b;
        --input-border: #334155;
        --accent: #8fb895;
        --accent-hover: #bfe0c4;
        --accent-text: #0f172a;
        --focus: rgba(143, 184, 149, 0.35);
        --error: #fca5a5;
        --error-bg: rgba(127, 29, 29, 0.35);
        --info: #bfe0c4;
        --info-bg: rgba(60, 92, 69, 0.3);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font);
        color: var(--text);
        background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom) 70%);
        background-color: var(--sky-top);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 22vh;
        position: relative;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      /* Sterne nur im Dark Mode */
      .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
      html.dark .stars { display: block; }
      .stars circle { fill: #fff; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 50% { opacity: 0.15; } }

      /* Berge am unteren Rand, wie im Blog-Header */
      .mountains {
        position: fixed; left: 0; right: 0; bottom: 0;
        width: 100%; height: 30vh; min-height: 140px;
        pointer-events: none;
      }
      .mountains .m1 { fill: var(--mtn-back); }
      .mountains .m2 { fill: var(--mtn-mid); }
      .mountains .m3 { fill: var(--ground); }

      main {
        position: relative; z-index: 1;
        width: 100%; max-width: 380px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 36px 28px 30px;
        box-shadow: 0 20px 50px -20px rgba(15, 23, 42, 0.45);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        text-align: center;
      }

      .icon {
        width: 52px; height: 52px; margin: 0 auto 18px;
        border-radius: 50%;
        display: grid; place-items: center;
        background: var(--info-bg);
        color: var(--accent);
      }
      h1 {
        font-size: 1.25rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.2em;
        margin: 0 0 10px;
      }
      p.lead {
        color: var(--muted); font-size: 0.85rem; line-height: 1.6;
        margin: 0 0 24px;
      }

      .field { position: relative; }
      input[type="password"], input[type="text"] {
        width: 100%;
        font: inherit; font-size: 1rem;
        color: var(--text);
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 10px;
        padding: 13px 48px 13px 14px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:-webkit-autofill {
        -webkit-text-fill-color: var(--text);
        -webkit-box-shadow: 0 0 0 40px var(--input-bg) inset;
        caret-color: var(--text);
      }
      input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px var(--focus); }
      .field.invalid input { border-color: var(--error); }
      .field.invalid { animation: shake 0.35s; }
      @keyframes shake {
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      .reveal {
        position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
        width: 38px; height: 38px;
        display: grid; place-items: center;
        border: 0; background: none; border-radius: 8px;
        color: var(--muted); cursor: pointer;
      }
      .reveal:hover { color: var(--text); }
      .reveal:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
      .reveal .eye-off { display: none; }
      .reveal[aria-pressed="true"] .eye { display: none; }
      .reveal[aria-pressed="true"] .eye-off { display: block; }

      button[type="submit"] {
        width: 100%; margin-top: 14px;
        font: inherit; font-size: 0.9rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.15em;
        color: var(--accent-text);
        background: var(--accent);
        border: 0; border-radius: 10px;
        padding: 14px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      button[type="submit"]:hover { background: var(--accent-hover); }
      button[type="submit"]:active { transform: scale(0.98); }
      button[type="submit"]:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus); }
      button[type="submit"]:disabled { opacity: 0.6; cursor: progress; }
      button[type="submit"].disabled { cursor: not-allowed; }
      input:disabled { opacity: 0.6; cursor: not-allowed; }

      .msg {
        font-size: 0.8rem; line-height: 1.5;
        border-radius: 8px; padding: 10px 12px;
        margin: 0 0 16px;
      }
      .msg[hidden] { display: none; }
      .msg.error { color: var(--error); background: var(--error-bg); }
      .msg.info { color: var(--info); background: var(--info-bg); }

      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }

      /* ------------------------------------------------------------- */
      /* Jahreszeiten: Herbst (Warmes Kupfer, Bernstein, Lärchenwald)  */
      /* ------------------------------------------------------------- */
      html.autumn:not(.dark) {
        --sky-top: #c98350;
        --sky-bottom: #ebd3b6;
        --mtn-back: #4a3429;
        --mtn-mid: #ab5d35;
        --card: rgba(255, 255, 255, 0.94);
        --card-border: rgba(74, 52, 41, 0.15);
        --accent: #ab5d35;
        --accent-hover: #8f4621;
        --focus: rgba(171, 93, 53, 0.35);
        --info: #ab5d35;
        --info-bg: #fbf1e8;
      }
      html.autumn:not(.dark) body {
        background: linear-gradient(135deg, #c98350 0%, #dfa06c 40%, #ebd3b6 75%);
        background-color: #c98350;
      }
      html.autumn.dark {
        --accent: #e09f67;
        --accent-hover: #ebd3b6;
        --info: #ebd3b6;
        --info-bg: rgba(201, 131, 80, 0.25);
      }

      /* ------------------------------------------------------------- */
      /* Jahreszeiten: Winter & Weihnachten (Frostige Felsen & Eisblau) */
      /* ------------------------------------------------------------- */
      html.winter:not(.dark),
      html.christmas:not(.dark) {
        --sky-top: #638ba8;
        --sky-bottom: #deecf6;
        --mtn-back: #3a4f63;
        --mtn-mid: #6d8ba1;
        --card: rgba(255, 255, 255, 0.94);
        --card-border: rgba(58, 79, 99, 0.15);
        --accent: #0284c7;
        --accent-hover: #0369a1;
        --focus: rgba(2, 132, 199, 0.35);
        --info: #0284c7;
        --info-bg: #e0f2fe;
      }
      html.winter:not(.dark) body,
      html.christmas:not(.dark) body {
        background: linear-gradient(135deg, #638ba8 0%, #8faec5 45%, #deecf6 75%);
        background-color: #638ba8;
      }
      html.winter.dark,
      html.christmas.dark {
        --sky-top: #030814;
        --sky-bottom: #142d50;
        --mtn-back: #264366;
        --mtn-mid: #14273e;
        --accent: #38bdf8;
        --accent-hover: #7dd3fc;
        --info: #38bdf8;
        --info-bg: rgba(56, 189, 248, 0.2);
      }
      html.winter.dark body,
      html.christmas.dark body {
        background: linear-gradient(to bottom, #030814 0%, #0a182f 50%, #142d50 100%);
        background-color: #030814;
      }

      /* Herbstblätter-Animation */
      #autumn-leaves {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: none; pointer-events: none; overflow: hidden; z-index: 0;
      }
      html.autumn:not(.dark) #autumn-leaves { display: block; }
      .leaf { position: absolute; }
      .leaf-amber { color: #d97706; }
      .leaf-orange { color: #c2410c; }
      .leaf-yellow { color: #a16207; }
      .leaf-rust { color: #9a3412; }

      @keyframes leafDrift1 {
        0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
        15% { opacity: 0.85; }
        40% { transform: translateY(30vh) translateX(18px) rotate(45deg); }
        75% { transform: translateY(65vh) translateX(-12px) rotate(110deg); opacity: 0.8; }
        100% { transform: translateY(105vh) translateX(15px) rotate(180deg); opacity: 0; }
      }
      @keyframes leafDrift2 {
        0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
        15% { opacity: 0.8; }
        45% { transform: translateY(35vh) translateX(-20px) rotate(-50deg); }
        70% { transform: translateY(65vh) translateX(14px) rotate(-100deg); opacity: 0.75; }
        100% { transform: translateY(105vh) translateX(-15px) rotate(-170deg); opacity: 0; }
      }
      @keyframes leafDrift3 {
        0% { transform: translateY(-20px) translateX(0) rotate(25deg); opacity: 0; }
        20% { opacity: 0.85; }
        50% { transform: translateY(40vh) translateX(16px) rotate(-20deg); }
        80% { transform: translateY(70vh) translateX(-10px) rotate(65deg); opacity: 0.7; }
        100% { transform: translateY(105vh) translateX(12px) rotate(140deg); opacity: 0; }
      }

      /* Winterschnee-Animation */
      #winter-snow {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: none; pointer-events: none; overflow: hidden; z-index: 0;
      }
      html.winter #winter-snow,
      html.christmas:not(.dark) #winter-snow { display: block; }
      .snowflake { position: absolute; top: 0; border-radius: 50%; }

      @keyframes snowFall1 {
        0% { transform: translateY(-10px) translateX(0); opacity: 0; }
        15% { opacity: 0.9; }
        50% { transform: translateY(50vh) translateX(15px); }
        100% { transform: translateY(105vh) translateX(-10px); opacity: 0.3; }
      }
      @keyframes snowFall2 {
        0% { transform: translateY(-10px) translateX(0); opacity: 0; }
        20% { opacity: 0.85; }
        50% { transform: translateY(50vh) translateX(-18px); }
        100% { transform: translateY(105vh) translateX(12px); opacity: 0.25; }
      }
      @keyframes snowFall3 {
        0% { transform: translateY(-10px) translateX(0); opacity: 0; }
        25% { opacity: 0.9; }
        60% { transform: translateY(60vh) translateX(22px); }
        100% { transform: translateY(105vh) translateX(-15px); opacity: 0.3; }
      }

      @media (prefers-reduced-motion: reduce) {
        .twinkle, .field.invalid, .leaf, .snowflake { animation: none; }
      }
    </style>
  </head>

      <div class="icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
      </div>
      <h1>Alissas Blog</h1>
      <p class="lead">Dieser Blog ist privat.<br />Bitte gib den Code ein. Du kannst Alissa fragen, wenn du den Code vergessen hast 😊</p>

      <p id="msg" class="msg" role="alert" hidden></p>

      <form id="login" method="post" action="/alissas-blog/dologin" novalidate>
        <!-- Apache mod_auth_form braucht einen Benutzernamen: fest vorgegeben, damit nur der Code eingegeben wird -->
        <input type="hidden" name="httpd_username" value="alissa" autocomplete="username" />
        <input type="hidden" name="httpd_location" id="location" value="/alissas-blog/" />
        <label for="password" class="sr-only">Code</label>
        <div class="field" id="field">
          <input type="password" id="password" name="httpd_password" placeholder="Code" autocomplete="current-password" required autofocus />
          <button type="button" class="reveal" id="reveal" aria-label="Code anzeigen" aria-pressed="false">
            <svg class="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          </button>
        </div>
        <button type="submit" id="submit">Weiter</button>
      </form>
    </main>

    <script>
      (function () {
        var BASE = "/alissas-blog/";
        var form = document.getElementById("login");
        var input = document.getElementById("password");
        var field = document.getElementById("field");
        var msg = document.getElementById("msg");
        var submit = document.getElementById("submit");
        var reveal = document.getElementById("reveal");
        var params = new URLSearchParams(location.search);

        var MAX_ATTEMPTS = 3;
        var LOCKOUT_MS = 24 * 60 * 60 * 1000; // 24 Stunden Sperre
        var STORAGE_KEY_ATTEMPTS = "alissas_blog_failed_attempts";
        var STORAGE_KEY_LOCKOUT = "alissas_blog_lockout_until";
        var STORAGE_KEY_ACTIVITY = "alissas_blog_last_activity";
        var lockoutTimer = null;

        // Nach dem Login zurück zur ursprünglich aufgerufenen Seite (nur innerhalb des Blogs)
        var target = params.get("r") || BASE;
        if (target.indexOf(BASE) !== 0 || target.indexOf("//") !== -1 || target.indexOf(BASE + "login.html") === 0) {
          target = BASE;
        }
        document.getElementById("location").value = target;

        function show(text, kind) {
          msg.textContent = text;
          msg.className = "msg " + kind;
          msg.hidden = false;
        }

        function getStoredLockout() {
          try {
            var val = localStorage.getItem(STORAGE_KEY_LOCKOUT);
            if (!val) return 0;
            var until = parseInt(val, 10);
            if (isNaN(until)) return 0;
            var diff = until - Date.now();
            if (diff <= 0) {
              localStorage.removeItem(STORAGE_KEY_LOCKOUT);
              localStorage.removeItem(STORAGE_KEY_ATTEMPTS);
              return 0;
            }
            return diff;
          } catch (e) {
            return 0;
          }
        }

        function formatDuration(ms) {
          var totalMinutes = Math.ceil(ms / (60 * 1000));
          var hours = Math.floor(totalMinutes / 60);
          var minutes = totalMinutes % 60;
          if (hours > 0) {
            return hours + (hours === 1 ? " Stunde" : " Stunden") + (minutes > 0 ? " und " + minutes + " Min." : "");
          }
          return totalMinutes + (totalMinutes === 1 ? " Minute" : " Minuten");
        }

        function updateLockoutUI() {
          var remaining = getStoredLockout();
          if (remaining > 0) {
            input.disabled = true;
            input.value = "";
            submit.disabled = true;
            submit.classList.add("disabled");
            show("Zu viele Fehlversuche. Der Login ist für 24 Stunden gesperrt (noch " + formatDuration(remaining) + ").", "error");
            if (!lockoutTimer) {
              lockoutTimer = setInterval(updateLockoutUI, 30 * 1000);
            }
            return true;
          } else {
            if (lockoutTimer) {
              clearInterval(lockoutTimer);
              lockoutTimer = null;
            }
            input.disabled = false;
            submit.disabled = false;
            submit.classList.remove("disabled");
            return false;
          }
        }

        function registerFailedAttempt() {
          var attempts = 1;
          try {
            attempts = parseInt(localStorage.getItem(STORAGE_KEY_ATTEMPTS) || "0", 10) + 1;
            localStorage.setItem(STORAGE_KEY_ATTEMPTS, String(attempts));
          } catch (e) {}

          if (attempts >= MAX_ATTEMPTS) {
            var lockUntil = Date.now() + LOCKOUT_MS;
            try {
              localStorage.setItem(STORAGE_KEY_LOCKOUT, String(lockUntil));
            } catch (e) {}
            updateLockoutUI();
          } else {
            var left = MAX_ATTEMPTS - attempts;
            var hint = left === 1
              ? "Falscher Code. Noch 1 Versuch, bevor der Login für 24 Stunden gesperrt wird."
              : "Falscher Code. Du hast noch " + left + " Versuche.";
            show(hint, "error");
            input.select();
          }
        }

        function onLoginSuccess() {
          try {
            localStorage.removeItem(STORAGE_KEY_ATTEMPTS);
            localStorage.removeItem(STORAGE_KEY_LOCKOUT);
            localStorage.removeItem("alissas_blog_logged_out");
            localStorage.setItem(STORAGE_KEY_ACTIVITY, String(Date.now()));
          } catch (e) {}
          location.replace(target);
        }

        // Status beim Laden prüfen
        if (updateLockoutUI()) {
          // Sperre aktiv
        } else {
          var logoutReason = null;
          try {
            logoutReason = sessionStorage.getItem("alissas_blog_logout_reason");
            if (logoutReason) sessionStorage.removeItem("alissas_blog_logout_reason");
          } catch (e) {}

          if (logoutReason === "timeout" || params.has("timeout")) {
            show("Du wurdest nach 1 Stunde Inaktivität automatisch abgemeldet.", "info");
          } else if (params.has("logout")) {
            try {
              localStorage.removeItem(STORAGE_KEY_ACTIVITY);
              localStorage.setItem("alissas_blog_logged_out", "true");
            } catch (e) {}
            show("Du wurdest abgemeldet.", "info");
          } else if (params.has("error")) {
            registerFailedAttempt();
          }
        }

        reveal.addEventListener("click", function () {
          if (input.disabled) return;
          var visible = input.type === "password";
          input.type = visible ? "text" : "password";
          reveal.setAttribute("aria-pressed", String(visible));
          reveal.setAttribute("aria-label", visible ? "Code verbergen" : "Code anzeigen");
          input.focus();
        });

        input.addEventListener("input", function () {
          field.classList.remove("invalid");
        });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (getStoredLockout() > 0) {
            updateLockoutUI();
            return;
          }
          if (!input.value) {
            input.focus();
            return;
          }
          submit.disabled = true;
          msg.hidden = true;

          fetch(form.action, {
            method: "POST",
            body: new URLSearchParams(new FormData(form)),
            credentials: "same-origin",
          })
            .then(function (res) {
              // Apache leitet bei Erfolg zur Zielseite weiter (und setzt das Session-Cookie),
              // bei falschem Code zurück auf login.html?error=1
              var landed = new URL(res.url, location.href);
              if (res.ok && landed.pathname.indexOf(BASE + "login.html") !== 0) {
                onLoginSuccess();
                return;
              }
              field.classList.remove("invalid");
              void field.offsetWidth; // Shake-Animation neu starten
              field.classList.add("invalid");

              if (landed.searchParams.has("error") || !res.ok) {
                registerFailedAttempt();
              } else {
                show("Anmeldung gerade nicht möglich. Bitte später nochmal versuchen.", "error");
              }
            })
            .catch(function () {
              show("Keine Verbindung. Bitte später nochmal versuchen.", "error");
            })
            .finally(function () {
              if (getStoredLockout() <= 0) {
                submit.disabled = false;
              }
            });
        });
      })();
    </script>
  </body>
</html>
